#MySQL 설정
sever:
    address: localhost
    port: 8080

spring:
    datasource:
        #driver-class-name: com.mysql.cj.jdbc.Driver
        driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
        #url: jdbc:mysql://localhost:3306/test?characterEncoding=UTF-8
        url: jdbc:log4jdbc:mysql://localhost:3306/test?characterEncoding=UTF-8
        username: root
        password: "!Qq1157338"
    jpa:
        databse: mysql
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                show_sql: true
                format_sql: true
    # View(JSP) 관련 설정
    mvc:
        view:
            prefix: /WEB-INF/jsp/
            suffix: .jsp

    # Table schema.spring_session doesn't exists 발생시
    session:
        store-type: jdbc
        jdbc:
            initialize-schema: always
        timeout: 900

#Mybatis 설정
mybatis:
    type-aliases-package: com.hyogasa.hgs2.model
    mapper-locations: mybatis/mapper/*.xml

#Mybatis 로그 설정
#    jdbc.sqlonly - SQL 문을 보여준다.
#    jdbc.sqltiming - SQL 문과 이 SQL 문을 수행하는 시간(ms)을 같이 보여준다.
#    jdbc.audit - ResultSet 을 제외한 모든 JDBC 호출 정보를 로그로 보여준다. 상당히 많은 양의 로그가 나오기 때문에 권장하지 않음.
#    jdbc.resultset - ResultSet 을 포함한 모든 JDBC 호출 정보를 로그로 보여준다. audit 처럼 많은 로그가 나오기 때문에 권장하지 않음.
#    jdbc.resultsettable - SQL 의 결과로 조회된 데이터를 table 형태로 로그를 보여준다.
#    jdbc.connection - DB 연결, 연결 해제와 관련된 로그를 보여준다
#    속성값 내용
#    ex) warn 으로 설정한 경우 이전 레벨인 debug, info 로그는 출력하지 않음.
#    따라서 개발하면서 계속 로그를 추적하고 싶은 경우 debug, info 로 설정하는 편을 권장.
#    off - 사용하지 않음
#    info - 정보성 로그
#    warn - 경고성 로그
#    error - 에러 로그
#    fatal - 심각한 문제 로그
logging:
    level:
        com:
            zaxxer:
                hikari: INFO
        javax:
            sql:
                DataSource: OFF
        jdbc:
            audit: OFF # JDBC 트러블슈팅 경우를 제외하고는 사용 권장 X
            resultset: OFF # ResultSet을 포함한 모든 JDBC 호출 정보를 출력
            resultsettable: OFF  #SQL 결과 데이터 Table형식으로 출력
            sqlonly: OFF     #SQL만 로그만 출력
            sqltiming: INFO    #SQL + 소요시간 출력
            connection: OFF  # 커넥션 연결/종료 정보 출력

